name: Fetch point-in-time fundamentals

# Retrieve NOAA GFS 0.25 degree forecast vintages for a window of delivery days and audit their
# availability against the operator's declared decision cutoff. This workflow produces evidence
# and nothing else: no value it retrieves may enter a forecast, a feature set or a reported
# result until the data-acceptance document of the v0.9 design's section 7 admits it.
#
# Two declarations have no default and no fallback, so the run stops at its guard steps without
# them: the sampling geography a gridded variable is read at, and the decision-cutoff schedule
# with its decision lead. The committed examples are refused by name.
#
# THE WINDOW IS RETRIEVED IN SLICES, AND THAT IS NOT AN OPTIMISATION. The first dispatched run
# of this workflow (`33760441164`, 3 September 2026) retrieved 30 delivery days in 36 minutes:
# 72 seconds per day, one HTTPS round trip per forecast step. The declared v0.9 window is 2,006
# delivery days, so a single job would need about forty hours against a ceiling of six, and
# would retain about 163 GB if it kept its raw messages. The window is pre-registered and cannot
# be shortened, and making the retrieval client concurrent would change how an evidence path
# talks to the provider. So the window is tiled into slices retrieved in parallel and put back
# together by `combine-feature-tables`, which refuses any set of slices that is not a tiling.
#
# A SLICE SURVIVES ITS SOURCE, AND SAYS SO. The first dispatch over the declared window
# (`33843070945`, 4 September 2026) lost six of 23 slices on attempt 1 and four on attempt 2, so
# `combine` never ran. Each loss was one delivery day's condition or one failed request ending 90
# days of retrieval. Since v0.9.7 a delivery day the archive says it does not hold, and one whose
# `.idx` sidecar indexes a different publication, are excluded by name and the slice continues;
# transport faults and 5xx answers are retried under a bounded policy; and only a `404` is read as
# absence. Everything else still fails the slice loudly, because an unanswered request is not
# evidence that a provider published nothing.
#
# Nothing retrieved is committed. The raw GRIB2 messages are not retained at all — their digests
# are recorded in the retrieval manifest — and the feature table, its manifest and the audit
# leave as a private artifact.

on:
  workflow_dispatch:
    inputs:
      start_day:
        description: First delivery day to retrieve (YYYY-MM-DD); the hourly record starts 2021-02-27
        required: true
        type: string
      end_day:
        description: Last delivery day to retrieve (YYYY-MM-DD), inclusive
        required: true
        type: string
      days_per_shard:
        description: >-
          Delivery days per parallel slice. At the measured 72 s/day, 90 days is about 1 h 50 m,
          comfortably inside the per-job ceiling.
        required: false
        default: "90"
        type: string
      variables:
        description: Space-separated feature variables
        required: false
        default: dswrf_surface temperature_2m wind_speed_10m
        type: string
      geography_config:
        description: Declared sampling geography JSON; see config/fundamentals_geography.example.json
        required: false
        default: config/fundamentals_geography.json
        type: string
      decision_cutoff_config:
        description: Declared decision-cutoff schedule JSON; see config/decision_cutoff.example.json
        required: false
        default: config/decision_cutoff.json
        type: string
      decision_lead_minutes:
        description: Declared decision lead in minutes; it has no default and may be 0
        required: true
        type: string
      fail_on_finding:
        description: Fail the run when any audited delivery day is not accepted
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      shards: ${{ steps.tile.outputs.shards }}
      shard_count: ${{ steps.tile.outputs.shard_count }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify the declared geography and decision cutoff exist
        shell: bash
        env:
          GEOGRAPHY_CONFIG: ${{ inputs.geography_config }}
          DECISION_CUTOFF_CONFIG: ${{ inputs.decision_cutoff_config }}
        run: |
          missing=0
          if [[ ! -f "$GEOGRAPHY_CONFIG" ]]; then
            echo "No declared sampling geography at '$GEOGRAPHY_CONFIG'."
            echo "A gridded variable has a value at every grid node; which nodes represent the"
            echo "Greek bidding zone, and with what weights, is a judgment with no default."
            echo "Copy config/fundamentals_geography.example.json, name the points and weights,"
            echo "state what the choice represents and its vintage, and commit it."
            missing=1
          fi
          if [[ ! -f "$DECISION_CUTOFF_CONFIG" ]]; then
            echo "No declared decision-cutoff schedule at '$DECISION_CUTOFF_CONFIG'."
            echo "Copy config/decision_cutoff.example.json, replace its placeholder reference"
            echo "with the day-ahead trading rule that was in force, add one regime per rule"
            echo "change, and commit it."
            missing=1
          fi
          exit "$missing"

      - name: Tile the window into slices
        id: tile
        shell: bash
        env:
          START_DAY: ${{ inputs.start_day }}
          END_DAY: ${{ inputs.end_day }}
          DAYS_PER_SHARD: ${{ inputs.days_per_shard }}
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          from datetime import date, timedelta

          start = date.fromisoformat(os.environ["START_DAY"])
          end = date.fromisoformat(os.environ["END_DAY"])
          size = int(os.environ["DAYS_PER_SHARD"])
          if end < start:
              raise SystemExit("end_day must not precede start_day")
          if size < 1:
              raise SystemExit("days_per_shard must be at least 1")

          shards = []
          cursor = start
          while cursor <= end:
              last = min(cursor + timedelta(days=size - 1), end)
              shards.append(
                  {
                      "index": len(shards),
                      "start_day": cursor.isoformat(),
                      "end_day": last.isoformat(),
                  }
              )
              cursor = last + timedelta(days=1)
          if len(shards) > 256:
              raise SystemExit(
                  f"{len(shards)} slices exceeds the matrix limit; raise days_per_shard"
              )
          print(f"shards={json.dumps(shards)}")
          print(f"shard_count={len(shards)}")
          PY

      - name: Say what will be retrieved
        shell: bash
        run: |
          {
            echo "## Retrieval plan"
            echo ""
            echo "- Window: \`${{ inputs.start_day }}\` to \`${{ inputs.end_day }}\`"
            echo "- Slices: ${{ steps.tile.outputs.shard_count }} of at most ${{ inputs.days_per_shard }} delivery days"
            echo ""
            echo "Each slice is retrieved independently and recombined by \`combine-feature-tables\`,"
            echo "which refuses any overlap, gap or mixed retrieval identity."
          } >> "$GITHUB_STEP_SUMMARY"

  retrieve:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.plan.outputs.shards) }}
    env:
      VARIABLES: ${{ inputs.variables }}
      GEOGRAPHY_CONFIG: ${{ inputs.geography_config }}
      SHARD_INDEX: ${{ matrix.shard.index }}
      SHARD_START: ${{ matrix.shard.start_day }}
      SHARD_END: ${{ matrix.shard.end_day }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the project
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Retrieve this slice
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p shard
          # No --raw-dir. The declared window would retain about 163 GB of GRIB2 messages, and
          # the retrieval manifest already records the digest and byte count of every message
          # the value was decoded from.
          greek-bess fetch-fundamentals \
            --source noaa_gfs \
            --variables $VARIABLES \
            --geography "$GEOGRAPHY_CONFIG" \
            --start-day "$SHARD_START" \
            --end-day "$SHARD_END" \
            --output "shard/features_${SHARD_INDEX}.csv" \
            --manifest "shard/features_${SHARD_INDEX}.retrieval_manifest.json"

      - name: Upload this slice
        uses: actions/upload-artifact@v4
        with:
          name: fundamentals-shard-${{ matrix.shard.index }}
          path: shard/
          if-no-files-found: error
          retention-days: 90

  combine:
    needs: [plan, retrieve]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      START_DAY: ${{ inputs.start_day }}
      END_DAY: ${{ inputs.end_day }}
      VARIABLES: ${{ inputs.variables }}
      DECISION_CUTOFF_CONFIG: ${{ inputs.decision_cutoff_config }}
      DECISION_LEAD_MINUTES: ${{ inputs.decision_lead_minutes }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the project
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Download every slice
        uses: actions/download-artifact@v4
        with:
          pattern: fundamentals-shard-*
          merge-multiple: true
          path: shards

      - name: Refuse unless every planned slice is present
        shell: bash
        env:
          EXPECTED: ${{ needs.plan.outputs.shard_count }}
        run: |
          set -euo pipefail
          actual=$(find shards -name 'features_*.csv' -type f | wc -l)
          echo "slices expected: $EXPECTED; slices present: $actual"
          test "$actual" = "$EXPECTED"

      - name: Combine the slices into one feature table
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p acceptance/fundamentals
          # Sorted numerically so the combination is deterministic; the command refuses any
          # overlap, gap or mixed retrieval identity regardless of the order it is given.
          mapfile -t slices < <(find shards -name 'features_*.csv' -type f | sort -V)
          greek-bess combine-feature-tables "${slices[@]}" \
            --output acceptance/fundamentals/features.csv \
            --manifest acceptance/fundamentals/retrieval_manifest.json

      - name: Audit availability against the declared decision cutoff
        shell: bash
        run: |
          set +e
          greek-bess audit-feature-availability \
            acceptance/fundamentals/features.csv \
            --decision-cutoff "$DECISION_CUTOFF_CONFIG" \
            --decision-lead-minutes "$DECISION_LEAD_MINUTES" \
            --variables $VARIABLES \
            --start-day "$START_DAY" --end-day "$END_DAY" \
            --output acceptance/fundamentals/delivery_days.csv
          status=$?
          set -e
          echo "AUDIT_EXIT=$status" >> "$GITHUB_ENV"
          # Exit code 2 is a recorded availability finding; the evidence is still uploaded.
          if [[ "$status" -ne 0 && "$status" -ne 2 ]]; then
            exit "$status"
          fi

      - name: Summarize the retrieval and the audit
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path("acceptance/fundamentals")
          retrieval = json.loads((root / "features.summary.json").read_text(encoding="utf-8"))
          audit = json.loads((root / "delivery_days.summary.json").read_text(encoding="utf-8"))
          verdict = (
              "Every audited delivery day is covered by values published before the declared "
              "decision cutoff."
              if audit["availability_accepted"]
              else "At least one audited delivery day is not fully covered before the cutoff."
          )
          lines = [
              "# Point-in-time fundamentals retrieval and availability audit",
              "",
              f"**{verdict}**",
              "",
              f"- Window: `{audit['audit_start_day']}` to `{audit['audit_end_day']}`",
              f"- Retrieved in {retrieval.get('shard_count', 1)} slices, recombined as a tiling",
              f"- Source: `{retrieval['source']}`, geography `{retrieval['geography_id']}`",
              f"- Decision cutoff: `{audit['decision_cutoff_schedule_id']}`, "
              f"lead {audit['decision_lead_minutes']} min",
              f"- Evidence basis: `{audit['evidence_basis']}`",
              f"- Documents retrieved: {retrieval['document_count']}",
              f"- Delivery days excluded by name: {retrieval['excluded_day_count']}",
              f"- Findings: {audit['finding_count']}",
              "",
              retrieval["attribution"],
              "",
              "This audit establishes availability only. It accepts no value and no unit, and "
              "it does not admit the source to any benchmark.",
              "",
          ]
          # Every delivery day the retrieval left out is named by its cause. A day is excluded
          # only on a condition the provider stated; a request the archive did not answer fails
          # the slice instead, so nothing here can be a network fault in disguise.
          causes = retrieval.get("excluded_day_count_by_cause") or {}
          if causes:
              lines += [
                  "## Delivery days excluded by named cause",
                  "",
                  "| Cause | Day count |",
                  "| --- | ---: |",
              ]
              lines += [f"| `{cause}` | {count} |" for cause, count in sorted(causes.items())]
              lines.append("")
          lines += [
              "| Variable | Days | Accepted | Witnessed | Min lead (min) |",
              "| --- | ---: | ---: | ---: | ---: |",
          ]
          for variable, row in audit["per_variable"].items():
              lead = row["min_decision_time_lead_minutes"]
              lines.append(
                  f"| {variable} | {row['audited_day_count']} | {row['accepted_day_count']} | "
                  f"{row['witnessed_day_count']} | "
                  f"{'-' if lead is None else round(lead, 1)} |"
              )
          print("\n".join(lines))
          step_summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if step_summary:
              Path(step_summary).write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Upload the feature table and its availability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: point-in-time-fundamentals
          path: |
            acceptance/fundamentals/features.csv
            acceptance/fundamentals/features.summary.json
            acceptance/fundamentals/features.coverage.csv
            acceptance/fundamentals/retrieval_manifest.json
            acceptance/fundamentals/delivery_days.csv
            acceptance/fundamentals/delivery_days.observations.csv
            acceptance/fundamentals/delivery_days.summary.json
          if-no-files-found: error
          retention-days: 90

      - name: Fail when the audit recorded an availability finding
        if: ${{ inputs.fail_on_finding }}
        shell: bash
        run: |
          if [[ "$AUDIT_EXIT" != "0" ]]; then
            echo "The audit recorded an availability finding; see the uploaded evidence."
            exit 1
          fi
