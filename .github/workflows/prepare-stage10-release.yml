name: Prepare the accepted Stage 10 aggregate for review

# Preparation does not publish. Source and aggregate identities are fixed in the helper.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the project
        run: python -m pip install .

      - name: Download the accepted private study
        uses: actions/download-artifact@v4
        with:
          name: integrated-study-private
          run-id: "35252229873"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: private/stage10-source

      - name: Verify retained evidence and prepare only the aggregate
        run: |
          python .github/scripts/prepare_stage10_release.py private/stage10-source \
            --output private/stage10-review > private/stage10-review-receipt.json

      - name: Retain the review receipt
        uses: actions/upload-artifact@v4
        with:
          name: stage10-review-receipt
          path: private/stage10-review-receipt.json
          if-no-files-found: error
          retention-days: 90

      - name: Retain exactly the aggregate review files
        uses: actions/upload-artifact@v4
        with:
          name: stage10-aggregate-review
          path: |
            private/stage10-review/index.html
            private/stage10-review/report.index.json
          if-no-files-found: error
          retention-days: 90
