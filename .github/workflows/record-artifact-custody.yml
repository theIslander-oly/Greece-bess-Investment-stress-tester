name: Record official artifact custody

# Fingerprints an accepted official artifact so that a copy held in private storage can
# later be proven to be that artifact, and so that a re-retrieval can be proven identical
# or shown to differ. The job runs inside Actions because the accepted artifacts exist
# only as private workflow artifacts (decision entry 2026-08-27).
#
# When a committed custody record already exists for an artifact, the job verifies the
# artifact against it and fails on any difference. When none exists, the job records one
# and uploads it for review. No official price is printed or committed either way.

on:
  workflow_dispatch:
    inputs:
      history_run_id:
        description: Run ID holding the greek-dam-official-history artifact
        required: true
        default: "33483975614"
        type: string
      reconciliation_run_id:
        description: >-
          Run ID holding the henex-entsoe-reconciliation artifact; empty skips it. The recorded
          artifact of run 33073631530 expired on 3 September 2026 and cannot be regenerated while
          ENTSOE_SECURITY_TOKEN is unset; its committed record is verifiable only against the
          decrypted release copy, by the drill in docs/official_artifact_custody.md.
        required: false
        default: ""
        type: string
      history_digest:
        description: SHA-256 GitHub publishes for the history artifact archive; recorded as provenance
        required: false
        default: "de30f4cc5938751dc00b8f08c2dbdbf24e2b23910ce6e59a6ccb3ff1dce48009"
        type: string
      reconciliation_digest:
        description: SHA-256 GitHub publishes for the reconciliation artifact archive
        required: false
        default: "bee557eaf4f2fa449fe9284bf2d80225e51350c622321cf921f3cbab033b816a"
        type: string
      feature_run_id:
        description: Run ID holding the point-in-time-fundamentals artifact; empty skips it
        required: false
        default: "34503398871"
        type: string
      feature_digest:
        description: SHA-256 GitHub publishes for the feature-table artifact archive
        required: false
        default: "3d988aba2b003f43f735fb5b935c9779670cda299b4fc6cc6758f52565dbe74b"
        type: string
      record_mode:
        description: >-
          auto verifies against a committed record; record always generates one, for a
          re-record against a replacement artifact. Neither writes to docs/custody/.
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - record
  push:
    paths:
      - .github/workflows/record-artifact-custody.yml
      - src/greek_bess/data/custody.py
      - docs/custody/**

permissions:
  contents: read
  actions: read

jobs:
  custody:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Push-triggered verification follows the committed records: the history and the feature
      # table. The reconciliation artifact expired on 3 September 2026 (see the input above).
      HISTORY_RUN_ID: ${{ inputs.history_run_id || '33483975614' }}
      RECONCILIATION_RUN_ID: ${{ inputs.reconciliation_run_id || '' }}
      HISTORY_DIGEST: >-
        ${{ inputs.history_digest
        || 'de30f4cc5938751dc00b8f08c2dbdbf24e2b23910ce6e59a6ccb3ff1dce48009' }}
      RECONCILIATION_DIGEST: >-
        ${{ inputs.reconciliation_digest
        || 'bee557eaf4f2fa449fe9284bf2d80225e51350c622321cf921f3cbab033b816a' }}
      RECORD_MODE: ${{ inputs.record_mode || 'auto' }}
      FEATURE_RUN_ID: ${{ inputs.feature_run_id || '34503398871' }}
      FEATURE_DIGEST: >-
        ${{ inputs.feature_digest
        || '3d988aba2b003f43f735fb5b935c9779670cda299b4fc6cc6758f52565dbe74b' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the project
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Download the accepted official history artifact
        uses: actions/download-artifact@v4
        with:
          name: greek-dam-official-history
          run-id: ${{ env.HISTORY_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts/greek-dam-official-history

      - name: Download the reconciliation artifact
        if: ${{ env.RECONCILIATION_RUN_ID != '' }}
        uses: actions/download-artifact@v4
        with:
          name: henex-entsoe-reconciliation
          run-id: ${{ env.RECONCILIATION_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts/henex-entsoe-reconciliation

      - name: Record or verify the official history custody
        shell: bash
        run: |
          .github/scripts/custody_step.sh \
            greek-dam-official-history \
            "$HISTORY_RUN_ID" \
            "Fetch official Greek market history" \
            "$HISTORY_DIGEST" \
            "$RECORD_MODE"

      - name: Record or verify the reconciliation custody
        if: ${{ env.RECONCILIATION_RUN_ID != '' }}
        shell: bash
        run: |
          .github/scripts/custody_step.sh \
            henex-entsoe-reconciliation \
            "$RECONCILIATION_RUN_ID" \
            "Reconcile HEnEx and ENTSO-E prices" \
            "$RECONCILIATION_DIGEST" \
            "$RECORD_MODE"

      - name: Download the accepted feature-table artifact
        if: ${{ env.FEATURE_RUN_ID != '' }}
        uses: actions/download-artifact@v4
        with:
          name: point-in-time-fundamentals
          run-id: ${{ env.FEATURE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts/accepted-fundamentals-feature-table

      - name: Record or verify the feature-table custody
        if: ${{ env.FEATURE_RUN_ID != '' }}
        shell: bash
        run: |
          .github/scripts/custody_step.sh accepted-fundamentals-feature-table \
            "$FEATURE_RUN_ID" "Fetch point-in-time fundamentals" \
            "$FEATURE_DIGEST" "$RECORD_MODE"

      - name: Show every generated record for review
        if: always()
        shell: bash
        run: |
          # A record holds digests and counts and no official value, so it can be read from the
          # log where the artifact cannot be fetched. Verification reports are not repeated here:
          # the step summary already states each verdict.
          shopt -s nullglob
          for record in custody/*.json; do
            case "$record" in *.verification.json) continue ;; esac
            echo "::group::${record}"
            cat "$record"
            echo "::endgroup::"
          done

      - name: Upload the custody records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-artifact-custody-records
          path: custody/
          if-no-files-found: error
          retention-days: 90

      - name: Fail when any artifact did not verify
        shell: bash
        run: |
          if [[ -f custody/verification_failed ]]; then
            echo "A stored artifact does not match its committed custody record."
            echo "This is a finding to investigate, not a check to re-run: an official"
            echo "publication may have been revised. See the uploaded verification report."
            exit 1
          fi
