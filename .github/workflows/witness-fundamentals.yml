name: Witness point-in-time fundamentals

# Retrieve tomorrow's delivery-day features *before* the declared decision cutoff, so that this
# project has observed them contemporaneously rather than reading the provider's word for it
# afterwards.
#
# This is the only evidence in v0.9 that cannot be backfilled. A provider-declared publication
# instant can be read at any time in the future; a witnessed one exists only if a retrieval
# actually happened before the cutoff of the day in question. Every day this workflow does not
# run is a day the witnessed subset can never recover, which is why it starts in v0.9.1 rather
# than at the acceptance run in v0.9.5.
#
# THE SCHEDULE BELOW IS AN OPERATOR SETTING. The 00 UTC cycle of D-1 was observed publishing
# forecast step 48 between 3 h 41 m and 4 h 10 m after the cycle
# (docs/fundamentals_source_assessment_2026-09-02.md, section 4.3), so 06:00 UTC is after the
# objects appear and before any midday CET gate. If the declared cutoff is earlier than that,
# change the cron here: the audit step below reports whether the retrieval actually landed in
# time, and a run that did not is recorded as provider-declared rather than witnessed.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      delivery_day:
        description: Delivery day to witness (YYYY-MM-DD); defaults to tomorrow
        required: false
        type: string

permissions:
  contents: read

jobs:
  witness:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DELIVERY_DAY: ${{ inputs.delivery_day }}
      VARIABLES: dswrf_surface temperature_2m wind_speed_10m
      GEOGRAPHY_CONFIG: config/fundamentals_geography.json
      DECISION_CUTOFF_CONFIG: config/decision_cutoff.json
      DECISION_LEAD_CONFIG: config/decision_lead_minutes.txt

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Refuse to witness without the declarations that decide what "in time" means
        shell: bash
        run: |
          missing=0
          for path in "$GEOGRAPHY_CONFIG" "$DECISION_CUTOFF_CONFIG" "$DECISION_LEAD_CONFIG"; do
            if [[ ! -f "$path" ]]; then
              echo "Missing declaration: $path"
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            echo ""
            echo "This run witnesses nothing, and today's witnessed day is not recoverable:"
            echo "a contemporaneous observation can only be made while it is contemporaneous."
            echo "Declare the sampling geography (config/fundamentals_geography.example.json),"
            echo "the decision-cutoff schedule (config/decision_cutoff.example.json) and the"
            echo "decision lead in minutes, one integer in $DECISION_LEAD_CONFIG."
            exit 1
          fi

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the project
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Resolve the delivery day and the declared decision lead
        shell: bash
        run: |
          day="$DELIVERY_DAY"
          if [[ -z "$day" ]]; then
            day="$(date -u -d 'tomorrow' +%Y-%m-%d)"
          fi
          echo "WITNESS_DAY=$day" >> "$GITHUB_ENV"
          lead="$(tr -d '[:space:]' < "$DECISION_LEAD_CONFIG")"
          if [[ ! "$lead" =~ ^[0-9]+$ ]]; then
            echo "$DECISION_LEAD_CONFIG must hold one non-negative integer number of minutes."
            exit 1
          fi
          echo "DECISION_LEAD_MINUTES=$lead" >> "$GITHUB_ENV"

      - name: Retrieve tomorrow's features now
        shell: bash
        run: |
          mkdir -p acceptance/witness
          greek-bess fetch-fundamentals \
            --source noaa_gfs \
            --variables $VARIABLES \
            --geography "$GEOGRAPHY_CONFIG" \
            --start-day "$WITNESS_DAY" \
            --end-day "$WITNESS_DAY" \
            --output "acceptance/witness/features_${WITNESS_DAY}.csv" \
            --manifest "acceptance/witness/retrieval_manifest_${WITNESS_DAY}.json"

      - name: Record whether the retrieval was in time to witness the day
        shell: bash
        run: |
          set +e
          greek-bess audit-feature-availability \
            "acceptance/witness/features_${WITNESS_DAY}.csv" \
            --decision-cutoff "$DECISION_CUTOFF_CONFIG" \
            --decision-lead-minutes "$DECISION_LEAD_MINUTES" \
            --variables $VARIABLES \
            --start-day "$WITNESS_DAY" \
            --end-day "$WITNESS_DAY" \
            --output "acceptance/witness/delivery_days_${WITNESS_DAY}.csv"
          status=$?
          set -e
          if [[ "$status" -ne 0 && "$status" -ne 2 ]]; then
            exit "$status"
          fi

      - name: Summarize the witness
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          day = os.environ["WITNESS_DAY"]
          audit = json.loads(
              Path(f"acceptance/witness/delivery_days_{day}.summary.json").read_text(
                  encoding="utf-8"
              )
          )
          witnessed = audit["witnessed_day_count"] > 0
          lines = [
              f"# Witnessed fundamentals for delivery day {day}",
              "",
              "**This retrieval witnessed the day contemporaneously.**"
              if witnessed
              else "**This retrieval did not land before the declared cutoff.** It is recorded "
              "as provider-declared evidence, and the schedule in this workflow is too late "
              "for the declared cutoff.",
              "",
              f"- Decision cutoff: `{audit['decision_cutoff_schedule_id']}`, "
              f"lead {audit['decision_lead_minutes']} min",
              f"- Evidence basis: `{audit['evidence_basis']}`",
              f"- Witnessed variable-days: {audit['witnessed_day_count']}"
              f" of {len(audit['audited_variables'])}",
              "",
              "A witnessed day cannot be produced later. Nothing here accepts a value or admits "
              "the source to a benchmark.",
          ]
          print("\n".join(lines))
          step_summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if step_summary:
              Path(step_summary).write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Upload the witnessed day
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: witnessed-fundamentals-${{ env.WITNESS_DAY }}
          path: |
            acceptance/witness/
          if-no-files-found: error
          # A witnessed day cannot be rebuilt, so it is kept for the maximum this plan allows
          # and is expected to be copied into durable custody before it expires.
          retention-days: 90
