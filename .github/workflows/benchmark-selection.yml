name: Compare official selection objectives

on:
  workflow_dispatch:
    inputs:
      history_run_id:
        description: Accepted price-history run named in the declaration
        required: true
        type: string
      declaration_document_sha256:
        description: SHA-256 of the reviewed Stage 9 run declaration
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  declared-selection-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      HISTORY_RUN_ID: ${{ inputs.history_run_id }}
      DECLARATION_DOCUMENT_SHA256: ${{ inputs.declaration_document_sha256 }}
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install .

      - name: Verify declaration before downloading history
        run: python .github/scripts/selection_run.py guard

      - name: Download accepted history
        uses: actions/download-artifact@v4
        with:
          name: greek-dam-official-history
          run-id: ${{ env.HISTORY_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts/greek-dam-official-history

      - name: Verify existing custody before reading prices
        shell: bash
        run: |
          set -euo pipefail
          greek-bess verify-custody artifacts/greek-dam-official-history \
            --record docs/custody/greek-dam-official-history.json \
            --report private/custody.verification.json >private/custody.log 2>&1

      - name: Prepare and check the exact declared calendar
        shell: bash
        run: |
          set -euo pipefail
          greek-bess merge-canonical \
            artifacts/greek-dam-official-history/henex_archived_prices.csv \
            artifacts/greek-dam-official-history/henex_daily_prices.csv \
            --output private/prices.csv >private/prepare.log 2>&1
          python .github/scripts/selection_run.py check-prices >>private/prepare.log 2>&1

      - name: Run the fixed comparison with private output
        shell: bash
        run: |
          set -euo pipefail
          greek-bess compare-selection-objectives private/prices.csv \
            --battery examples/battery_50mw_100mwh.json \
            --validation-start-day 2024-10-01 --evaluation-start-day 2025-10-01 \
            --feature-window-days 28 --refit-frequency-days 7 --min-training-days 28 \
            --random-seed 42 --evidence-class retrospective_supplementary \
            --output private/selection.csv --validation-scoreboard private/validation.csv \
            --summary private/selection.summary.json --forecasts private/forecasts.csv \
            >private/command.log 2>&1

      - name: Verify result windows and index the evidence
        run: python .github/scripts/selection_run.py seal >private/seal.log 2>&1

      - name: Retain evidence including failed-run diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selection-comparison-private
          path: private/
          if-no-files-found: warn
          retention-days: 90

      - name: Write artifact identity and labels only
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          - Artifact: `selection-comparison-private`; requires an evidence index for a completed run.
          - Retrospective supplementary research; no confirmatory claim.
          - Perfect foresight is a gross-margin upper bound only, not expected revenue.
          - Retrospective best candidate is a diagnostic ceiling, not an achievable policy.
          - Publication and any change to the shipped selection policy require separate review.
          EOF
