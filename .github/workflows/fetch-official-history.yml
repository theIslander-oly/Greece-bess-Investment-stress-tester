name: Fetch official Greek market history

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fetch-official-history.yml
  workflow_dispatch:
    inputs:
      archive_start_year:
        description: First verified HEnEx annual archive year
        required: true
        default: "2020"
        type: string
      archive_end_year:
        description: Last verified HEnEx annual archive year
        required: true
        default: "2025"
        type: string
      daily_start:
        description: Optional unarchived HEnEx start day (YYYY-MM-DD)
        required: false
        default: ""
        type: string
      daily_end:
        description: Optional unarchived HEnEx end day (YYYY-MM-DD)
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ARCHIVE_START_YEAR: ${{ inputs.archive_start_year || '2020' }}
      ARCHIVE_END_YEAR: ${{ inputs.archive_end_year || '2025' }}
      DAILY_START: ${{ inputs.daily_start || '' }}
      DAILY_END: ${{ inputs.daily_end || '' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Fetch archived HEnEx DAM history
        run: |
          mkdir -p acceptance/henex
          greek-bess fetch-henex-archives \
            --start-year "$ARCHIVE_START_YEAR" \
            --end-year "$ARCHIVE_END_YEAR" \
            --raw-dir data/raw/henex \
            --manifest acceptance/henex/archive_manifest.json \
            --output acceptance/henex/henex_archived_prices.csv

      - name: Validate optional daily range inputs
        shell: bash
        run: |
          if [[ -n "$DAILY_START" && -z "$DAILY_END" ]] || \
             [[ -z "$DAILY_START" && -n "$DAILY_END" ]]; then
            echo "daily_start and daily_end must either both be set or both be empty."
            exit 1
          fi

      - name: Fetch unarchived daily HEnEx results
        if: ${{ env.DAILY_START != '' && env.DAILY_END != '' }}
        run: |
          greek-bess fetch-henex-daily \
            --start-day "$DAILY_START" \
            --end-day "$DAILY_END" \
            --raw-dir data/raw/henex \
            --manifest acceptance/henex/daily_manifest.json \
            --output acceptance/henex/henex_daily_prices.csv

      - name: Upload normalized data, manifests and quality reports
        uses: actions/upload-artifact@v4
        with:
          name: greek-dam-official-history
          path: acceptance/henex/
          if-no-files-found: error
          retention-days: 90
