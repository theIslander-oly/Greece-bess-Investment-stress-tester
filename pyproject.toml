[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "greek-bess-investment-stress-tester"
version = "0.7.7"
description = "Transparent research and pre-feasibility tooling for Greek standalone BESS projects."
readme = "README.md"
requires-python = ">=3.12"
license = "LicenseRef-Proprietary"
authors = [{name = "Greek BESS Investment Stress Tester project"}]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "openpyxl>=3.1,<4",
  "scipy>=1.14,<2",
  "scikit-learn>=1.5,<2",
]

[project.scripts]
greek-bess = "greek_bess.cli:main"

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
greek_bess = ["py.typed"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
# A warning attributed to this project's own modules is a defect this project can fix, so it
# fails the suite. A warning attributed to a dependency stays visible in the pytest summary
# without failing the run: `[project].dependencies` declares ranges rather than exact versions
# and CI resolves them at install time, so a blanket `error` would let an upstream release,
# rather than a reviewed change here, decide when validation breaks. A third-party warning that
# must fail is added below by category and module with a recorded reason; there are none today.
filterwarnings = [
  "error:::greek_bess",
  "error:::tests",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
packages = ["greek_bess"]
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true
exclude = ["build/", "dist/"]
